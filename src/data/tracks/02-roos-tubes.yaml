
title: "Roo's Tubes"
slug: 02-roos-tubes
difficulty: beginner
description: >-
  A simple track, perfect example of SG.

categories:
  - any-percent-nmg
  - 101-percent

notes:
  - title: "Speed ghost is key"
    content: "Take advantage of the big downhills to get good SGs."

boss:
  isBossTrack: true
  name: Roo

ctrToken:
  available: true
  mapMarkers:
    - letter: C
      x: 32.5
      y: 41.0
      description: "Near the first major turn"
    - letter: T
      x: 57.0
      y: 28.0
    - letter: R
      x: 73.0
      y: 54.0

relicRace:
  available: true
  strategy: >-
    Prioritize crates along the racing line and plan detours
    around the sections with the highest crate density.

assets:
  thumbnail: "/images/tracks/roos-tubes/thumbnail.webp"
  minimap: "/images/tracks/roos-tubes/minimap.webp"

routes:
  - id: safe
    name: Beginner route
    difficulty: beginner
    categories:
      - any-percent-nmg

    steps:
      - step: 1
        description: "Do as many MT as possible."

      - step: 2
        description: "Get the wumpa crates when possible."

      - step: 3
        description: "Froggy after downhills to maintain high speed."


  - id: performace
    name: Advanced route
    difficulty: advanced
    categories:
      - any-percent-nmg
    
    steps:
      - step: 1
        description: "MT into the left side of the first turn to minimize air time."

      - step: 2
        description: "Froggy after the first downhill untill you reach the top."

      - step: 3
        description: "Corner the right turn and get the boost pads. Get an SG for the downhill. Try to snipe the wumpa crate with an item."

      - step: 4
        description: "Take the off-road shortcut."
        shortcut: offroad

shortcuts:
  - id: offroad
    name: Off-road shortcut
    description: "Keep high speed while drifting on the off-road of the last turn."

    categories:
      - any-percent-nmg
      - 101-percent

    timeSave:
      minSeconds: 3
      maxSeconds: 4

    difficulty: medium

    video:
      youtubeUrl: "Pg2TVmfSSAQ"
      timestamp: "97"

    steps:
      - instruction: "Drift onto the off-road. Go left or right of the mushrooms. Right is easy but slower."
        cue: "Keep on drifting without jumping or it will slow you down. Credits: Alessandro Mastroianni"
        image: "/images/tracks/roos-tubes/offroad-setup.jpg"

timeTargets:
  nTropyUnlock: "1:34.19"
  nTropyGhost: "1:23.65"
  oxideGhost: "1:19.17"
